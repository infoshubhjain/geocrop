name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -e '.[test]'
      - run: npm ci
      - run: ruff check geocrop tests
      - run: ruff format --check geocrop tests
      - run: pytest
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run format:check
      - run: npm run build
