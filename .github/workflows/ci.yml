name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: pip install uv==0.12.15
      - run: uv sync --locked --extra test --python python
      - run: npm ci
      - run: .venv/bin/ruff check geocrop tests scripts
      - run: .venv/bin/ruff format --check geocrop tests scripts
      - run: .venv/bin/pytest
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run format:check
      - run: npm run build
