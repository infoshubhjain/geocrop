[project]
name = "geocrop"
version = "0.1.0"
description = "Satellite crop condition decision-support demonstrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=2,<3",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "rasterio>=1.4,<2",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["geocrop*"]

[tool.ruff]
line-length = 100
